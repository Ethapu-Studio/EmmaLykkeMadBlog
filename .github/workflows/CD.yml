name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EmmaLykkeMadBlog.sln

      - name: Build
        run: dotnet build EmmaLykkeMadBlog.sln --configuration Release --no-restore

      - name: Publish frontend
        run: dotnet publish EmmaLykkeMadBlog/EmmaLykkeMadBlog.csproj --configuration Release --output ./publish/frontend --no-build

      - name: Publish API
        run: dotnet publish EmmaLykkeMadBlogApi/EmmaLykkeMadBlogApi.csproj --configuration Release --output ./publish/api --runtime win-x64 --self-contained false

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: emma-lykke-madblog-release
          path: ./publish

  deploy:
    name: Deploy to Emma Lykke Madblog Server
    needs: build-and-publish
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: emma-lykke-madblog-release
          path: ./publish

      - name: Deploy frontend
        shell: powershell
        run: |
          $frontendPath = "C:\ActiveServers\Sk0v.dk\Emma\Frontend"
          $appPool = "EmmaLykkeMadBlog"
          $site = "EmmaLykkeMadBlog"

          Import-Module WebAdministration

          Write-Host "Stopping IIS site and application pool..."
          Stop-Website -Name $site -ErrorAction SilentlyContinue

          if ((Get-WebAppPoolState -Name $appPool).Value -ne "Stopped") {
              Stop-WebAppPool -Name $appPool
          }

          # Give IIS/ASP.NET Core a moment to release files
          Start-Sleep -Seconds 3

          New-Item -ItemType Directory -Force -Path $frontendPath | Out-Null

          Write-Host "Deploying frontend..."
          robocopy ".\publish\frontend" $frontendPath /MIR /R:3 /W:5 /XF appsettings.Production.json

          # Robocopy codes 0-7 mean success, 8 or higher means failure
          if ($LASTEXITCODE -gt 7) {
              throw "Frontend deployment failed. Robocopy exit code: $LASTEXITCODE"
          }
          Write-Host "Frontend copied successfully. Robocopy exit code: $LASTEXITCODE"

          Write-Host "Starting IIS application pool and site..."
          Start-WebAppPool -Name $appPool
          Start-Website -Name $site

          Write-Host "Frontend deployment completed successfully."

          # Stop Robocopy's exit code 1 from failing the step
          $global:LASTEXITCODE = 0

      - name: Deploy API
        shell: powershell
        run: |
          $apiPath = "C:\ActiveServers\Sk0v.dk\Emma\API"
          $serviceName = "emma-api"

          New-Item -ItemType Directory -Force -Path $apiPath | Out-Null

          # The service may not exist yet; only stop/start it if it does
          $service = Get-Service -Name $serviceName -ErrorAction SilentlyContinue
          if ($service -and $service.Status -ne "Stopped") {
              Write-Host "Stopping $serviceName..."
              Stop-Service -Name $serviceName -Force
          }

          Write-Host "Deploying API..."
          robocopy ".\publish\api" $apiPath /MIR /R:3 /W:5 /XF appsettings.Production.json

          if ($LASTEXITCODE -gt 7) {
              throw "API deployment failed. Robocopy exit code: $LASTEXITCODE"
          }
          Write-Host "API copied successfully. Robocopy exit code: $LASTEXITCODE"

          if ($service) {
              Write-Host "Starting $serviceName..."
              Start-Service -Name $serviceName
          }

          Write-Host "API deployment completed successfully."

          # Stop Robocopy's exit code 1 from failing the step
          $global:LASTEXITCODE = 0