name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EmmaLykkeMadBlog.sln

      - name: Build
        run: dotnet build EmmaLykkeMadBlog.sln --configuration Release --no-restore

      - name: Publish frontend
        run: dotnet publish EmmaLykkeMadBlog/EmmaLykkeMadBlog.csproj --configuration Release --output ./publish/frontend --no-build

      - name: Publish API
        run: dotnet publish EmmaLykkeMadBlogApi/EmmaLykkeMadBlogApi.csproj --configuration Release --output ./publish/api --runtime win-x64 --self-contained false

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: emma-lykke-madblog-release
          path: ./publish

  deploy:
    name: Deploy to Emma Lykke Madblog Server
    needs: build-and-publish
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: emma-lykke-madblog-release
          path: ./publish