name: CI

on:
  push:
    branches:
      - development

  pull_request:
    branches:
      - development

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore EmmaLykkeMadBlog.sln

      - name: Build
        run: dotnet build EmmaLykkeMadBlog.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test EmmaLykkeMadBlog.sln --configuration Release --no-build